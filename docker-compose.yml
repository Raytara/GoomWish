# Lancement : docker compose up -d --build
# Les clés viennent du fichier .env (GROQ_API_KEY…), la base est dans ./data
# Première fois : créez le dossier avant de lancer (mkdir -p data), sinon Docker le crée en root
# et l'app ne pourra pas y écrire.
services:
  goomwish:
    build: .
    container_name: goomwish
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      # GOOMWISH_BIND se règle dans .env :
      #   (absent)         -> accessible sur le réseau local, utile pour tester
      #   GOOMWISH_BIND=127.0.0.1 -> accessible uniquement depuis le Raspberry (à utiliser avec Tailscale)
      - "${GOOMWISH_BIND:-0.0.0.0}:3000:3000"
    volumes:
      # Les recettes sont conservées ici, même si le conteneur est reconstruit.
      # « :z » est nécessaire sur Fedora (SELinux) et sans effet ailleurs.
      - ./data:/app/data:z
    tmpfs:
      # Fichiers audio temporaires, effacés à chaque redémarrage
      - /app/tmp
